name: Release latest

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: latest-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute version
        id: version
        run: |
          base=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          base=$(printf '%s' "$base" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          ts=$(git show -s --format=%cd --date=format:%Y%m%d%H%M%S HEAD)
          sha=$(git rev-parse --short=7 HEAD)
          echo "version=${base}.${ts}git.${sha}" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS DMG
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set build version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          py=$(command -v python3 || command -v python)
          "$py" - <<'PY'
          import json, os
          path = "mygo.json"
          with open(path) as f:
              cfg = json.load(f)
          cfg["version"] = os.environ["VERSION"]
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          PY
          grep '"version"' mygo.json

      # The repository signs with a certificate of its own, which a runner has
      # none of: -sign - ad hoc signs instead, so that the app still opens.
      - name: Build universal DMG
        env:
          MYGO_LDFLAGS: -X main.version=${{ needs.prepare.outputs.version }}
        run: go tool mygo build -platform darwin/universal -sign - -skip-notarize

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/darwin-universal/*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux packages
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set build version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          py=$(command -v python3 || command -v python)
          "$py" - <<'PY'
          import json, os
          path = "mygo.json"
          with open(path) as f:
              cfg = json.load(f)
          cfg["version"] = os.environ["VERSION"]
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          PY
          grep '"version"' mygo.json

      - name: Build amd64 and arm64 packages
        env:
          MYGO_LDFLAGS: -X main.version=${{ needs.prepare.outputs.version }}
        run: |
          go tool mygo build -platform linux/amd64
          go tool mygo build -platform linux/arm64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/linux-amd64/*.tar.gz
            dist/linux-amd64/*.deb
            dist/linux-arm64/*.tar.gz
            dist/linux-arm64/*.deb
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set build version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          py=$(command -v python3 || command -v python)
          "$py" - <<'PY'
          import json, os
          path = "mygo.json"
          with open(path) as f:
              cfg = json.load(f)
          cfg["version"] = os.environ["VERSION"]
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          PY
          grep '"version"' mygo.json

      # mygo builds the setup with NSIS, which it downloads on Windows when
      # it is not there.
      - name: Build the executable and its installer
        env:
          MYGO_LDFLAGS: -X main.version=${{ needs.prepare.outputs.version }}
        run: go tool mygo build -platform windows/amd64

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/windows-amd64/Kacha.exe
            dist/windows-amd64/kacha-setup-*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish latest release
    needs: [prepare, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check packages
        run: |
          count=$(find dist -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.exe' \) | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "no release packages were downloaded" >&2
            exit 1
          fi
          find dist -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.exe' \) -print

      - name: Move latest tag
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "Rolling build ${VERSION} from ${GITHUB_SHA}."
            echo
            echo "- macOS: universal DMG (ad-hoc signed, not notarized; right-click > Open if Gatekeeper blocks)"
            echo "- Linux: amd64 and arm64 tar.gz and .deb, which depend on wl-clipboard and xdg-desktop-portal"
            echo "- Windows: amd64 executable and NSIS setup (unsigned; SmartScreen asks once)"
            echo "- Captures Wayland sessions through the desktop portal and X11 not at all on Linux"
            echo "- The .deb installs /usr/bin/kacha, which a keybinding can run"
            echo
            echo "Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          } > /tmp/release-notes.md

          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes
          fi
          gh release create latest --title "Latest (${VERSION})" --latest --verify-tag --notes-file /tmp/release-notes.md

          find dist -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.exe' \) -print0 \
            | xargs -0 -r gh release upload latest --clobber

          gh release view latest --json assets --jq '.assets[].name'
